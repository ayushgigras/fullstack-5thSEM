<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar with Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo:hover {
            color: #4CAF50;
        }

        .nav-links {
            display: flex;
            list-style-type: none;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #4CAF50;
        }

        .container {
            padding: 50px;
            text-align: center;
        }

        .container h1 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav>
        
        <div class="logo">🏢 MyBrand</div>

        <ul class="nav-links">
            <li><a href="1.html">Home</a></li>
            <li><a href="2.html">About Us</a></li>
            <li><a href="3.html">Contact Us</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Welcome to Our Website</h1>
        <p>This navbar is built using Flexbox - Logo on the left, Links on the right!</p>
    </div>
</body>
</html>
