<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @layer special, base;
        @layer base {
            p{
                font-size: 20px;
                color: red;
            }
            button{
                background-color: hotpink;
                border-radius: 100%;
                height: 100px;
                width: 100px;
                border: 10px dashed skyblue;
                box-shadow: violet 1px 1px 10px;
                
            }
        }
        @layer special{
            p{
                color: blue;
            }
        }
    </style>
</head>
<body>
    <p>Specificity</p>
    <button> CLICK HERE </button>
</body>
</html>
