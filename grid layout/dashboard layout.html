<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 25% 75%;
            grid-template-rows: 15% 1fr 10%;
            height: 100vh;
        }

        header {
            grid-column: 1 / 3;
            border: 2px solid black;
            text-align: center;
        }

        aside {
            grid-column: 1;
            grid-row: 2;
            border: 2px solid black;
            text-align: center;
        }

        main {
            grid-column: 2;
            grid-row: 2;
            display: grid;
            grid-template-rows: 70% 30%;
            border: 2px solid black;
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 2px solid black;
            text-align: center;
        }

        footer {
            grid-column: 1 / 3;
            border: 2px solid black;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header>HEADER</header>

        <aside>SIDEBAR</aside>

        <main>
            <section>MAIN CONTENT</section>

            <div class="cards">
                <div>CARD 1</div>
                <div>CARD 2</div>
            </div>
        </main>

        <footer>FOOTER</footer>

    </div>

</body>
</html>
