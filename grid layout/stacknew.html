<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --box-shadow-color: rgba(0, 0, 0, 0.2);
            --border-color: #70452d;
            --background-color: #b88655;
            --child-background-color: #9ed8d0;
            --inner-background-color: #f5c56b;
            --text-size:30px;
            --multiplier:2;
        }

        .container {
            display: grid;
            place-items: center;
            outline: 1px solid black;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            height: 500px;
            width: 500px;
            background-color: var(--background-color);
        }

        .parent {
            display: grid;
            place-items: center;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/4;
            grid-row: 1/4;
            width: 78%;
            height: 78%;
            background-color: #ead7b7;
            border: 8px solid #70452d;
            box-shadow: inset 0 0 0 8px #d29a62, inset 0 0 0 16px #70452d;
        }

        .child {
            display: grid;
            place-items: center;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 2/3;
            grid-row: 2/3;
            width: 72%;
            height: 72%;
            background-color: #9ed8d0;
            border: 7px solid #245b61;
            box-shadow: inset 0 0 0 7px #d6f1dc, inset 0 0 0 14px #245b61;
        }

        .inner {
            grid-column: 2;
            grid-row: 2;
            width: 54%;
            height: 54%;
            background-color: #f5c56b;
            border: 6px solid #9c4f37;
            box-shadow: inset 0 0 0 6px #ffe7a8, inset 0 0 0 12px #9c4f37;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="parent">
            <div class="child">
                <div class="inner"></div>
            </div>
        </div>
    </div>
</body>

</html>
