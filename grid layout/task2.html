<!--classic dashboard with header, sidebar,main content , cards and footer-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            height: 100vh;
            margin: 0;
        }
        header {
            grid-area: header;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }
        aside {
            grid-area: sidebar;
            background-color: #f4f4f4;
            padding: 10px;
        }
        main {
            grid-area: main;
            background-color: #fff;
            padding: 10px;
        }
        footer {
            grid-area: footer;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
</style>
</head>
<body>
    <header>
        <h1>Dashboard</h1>
    </header>
    <aside>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Profile</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </nav>
    </aside>
    <main>
        <section>
            <h2>Main Content</h2>
            <p>This is the main content area.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Dashboard. All rights reserved.</p>
    </footer>
</body>
</html>
